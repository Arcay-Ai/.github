# Claude reviews a pull request when someone comments "@claude review" on it ("@claude review deep" for a deep one,
# or "@claude <question>" to ask about the change). The review itself lives in Arcay-Ai/.github; this file only calls it.
#
# Needs two repo secrets, set for every repo by scripts/set-claude-secrets.sh in Arcay-Ai/.github:
# CLAUDE_CODE_OAUTH_TOKEN and LINEAR_API_KEY. Works once this file is on the default branch.
name: Claude review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # Skipped (no Actions minutes) unless the comment mentions @claude.
    if: contains(github.event.comment.body, '@claude')
    uses: Arcay-Ai/.github/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
